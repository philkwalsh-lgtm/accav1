name: Build shortlist

# Saturday 3pm games. One scheduled run on Saturday morning, plus a button in
# the Actions tab whenever you want it rebuilt.
#
# Why only once: The Odds API's free tier is 500 credits/month and a run costs
# about 45 (5 for the league sweep, 1 per shortlisted fixture for BTTS). One
# scheduled run a week is ~195/month, leaving ~300 spare for manual rebuilds.
# Two scheduled runs would be ~390 and leave almost nothing.
#
# To cover other days later, edit SLOTS in accatool/config.py -- one line.
on:
  schedule:
    - cron: '0 8 * * 6'    # Saturday 08:00 UTC (09:00 UK)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the page
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python run.py --source oddsapi --out docs/index.html

      # If the run found no fixtures it exits without writing, so there is
      # nothing to commit and the previous page stays up. Better a page that
      # is a few days old than an empty one.
      - name: Publish
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/
            git commit -m "Update shortlist $(date -u +'%Y-%m-%d %H:%M')"
            git push
            echo "Published."
          else
            echo "No change — leaving the existing page up."
          fi
